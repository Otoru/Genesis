[tox]
isolated_build = True
envlist = py311,py312,py313,py314

[testenv]
skip_install = true
allowlist_externals = poetry
setenv =
    POETRY_VIRTUALENVS_PATH = {envdir}/poetry-envs
    POETRY_VIRTUALENVS_IN_PROJECT = false
commands =
    poetry env use {envpython}
    poetry install --no-interaction --no-ansi --sync
    py311: poetry run python -c "import sys; assert sys.version_info[:2] == (3, 11), (sys.executable, sys.version); print(sys.executable); print(sys.version)"
    py312: poetry run python -c "import sys; assert sys.version_info[:2] == (3, 12), (sys.executable, sys.version); print(sys.executable); print(sys.version)"
    py313: poetry run python -c "import sys; assert sys.version_info[:2] == (3, 13), (sys.executable, sys.version); print(sys.executable); print(sys.version)"
    py314: poetry run python -c "import sys; assert sys.version_info[:2] == (3, 14), (sys.executable, sys.version); print(sys.executable); print(sys.version)"
    poetry run python -m black --check genesis/ tests/ examples/
    poetry run python -m mypy genesis/
    poetry run python -m mypy tests/simulator
    poetry run python -m pytest tests/ -q --override-ini="addopts=--timeout=10"
